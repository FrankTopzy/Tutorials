<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: rgb(31, 49, 31);
      color: white;
    }

    .container {
      height: 100vh;
      width: 100%; 
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .login-form input {
      width: 400px;
      padding-block: 10px;
    }

    .submit-btn {
      padding: 10px 20px;
      cursor: pointer;
    }


  </style>
</head>
<body>
  <div class="container"> 
    <p>Message</p>
    <form action="" id="login_form" class="login-form">
      <input type="text" class="name-input" id="name_input">
      <input type="text" class="pwd-input" id="pwd_input">
      <button class="submit-btn" id="submit_btn">Submit</button>
    </form>
  </div>

  <script>
    const submitBtn = document.getElementById('submit_btn');
    const loginForm = document.getElementById('login_form');

    async function signIn() {
      
    }

    loginForm.addEventListener('submit', async (e) => {
      const user = document.getElementById('name_input').value;
      const pwd = document.getElementById('pwd_input').value;

      e.preventDefault();

      try {
        const response = await fetch( 'http://localhost:3500/register', 
          {
            method: "POST",
            headers: {
              "Content-Type" : "application/json"  
            },
            credentials: 'include',
            body: JSON.stringify({ user, pwd })
          }
        );

        if(!response.ok) {
          if (response.status === 401) {
            console.log('token expires');
            return;
          }

          throw new Error(`${response.status} ${response.statusText}`)
        }

        const data = await response.json();

        console.log(data);
        

        return data;
      } catch (err) {
        console.log(err);
      }
    })
  </script>
</body>
</html>
